<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Exercice 10 - Formulaire GET</title>
    <style>
        form { max-width: 400px; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        div { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; }
        input, select { width: 100%; padding: 6px; box-sizing: border-box; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Exercice 10 (Partie A) : Formulaire avec méthode GET</h1>

    <form action="ex10_get.php" method="GET">
        <div>
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" placeholder="Votre nom">
        </div>
        <div>
            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom" placeholder="Votre prénom">
        </div>
        <div>
            <label for="groupe">Groupe :</label>
            <select id="groupe" name="groupe">
                <option value="">-- Choisir un groupe --</option>
                <option value="G1">G1</option>
                <option value="G2">G2</option>
                <option value="G3">G3</option>
                <option value="G4">G4</option>
            </select>
        </div>
        <button type="submit">Envoyer via GET</button>
    </form>

    <p><a href="index.php">Retour à l'accueil</a></p>
</body>
</html>
